name: seguridad_familiar
description: "Plataforma de Seguridad Familiar y Urbana 2026 con Resiliencia Offline y Detección Automática de Eventos"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  provider: ^6.1.2
  http: ^1.2.1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Flutter web support is enabled by default in recent Flutter versions.
  # To ensure web is a target platform, run: flutter create . --platforms=android,ios,web
